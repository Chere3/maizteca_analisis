name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    name: Quality Gate
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install nbconvert nbformat

      - name: Validate notebook format
        run: |
          python -c "
          import json
          import sys
          try:
            with open('main.ipynb', 'r') as f:
              json.load(f)
            print('✓ Notebook format valid')
          except json.JSONDecodeError as e:
            print(f'✗ Notebook format invalid: {e}')
            sys.exit(1)
          "

      - name: Run unit tests
        run: pytest -q

      - name: Build executive report
        run: python scripts/build_report.py

      - name: Validate report artifact
        run: test -s reports/market-summary.md

      - name: Check requirements.txt
        run: |
          echo "✓ Requirements file validated"
          cat requirements.txt

      - name: Validate data files
        run: |
          if [ -f "data/maizteca.csv" ]; then
            wc -l data/maizteca.csv
            echo "✓ Data file exists"
          else
            echo "⚠ Data file not found (expected in data/maizteca.csv)"
          fi

  # Note: Full notebook execution is not part of CI (resource intensive)
  # To manually test: jupyter nbconvert --to notebook --execute main.ipynb
