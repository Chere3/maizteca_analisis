[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maizteca-analysis"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
maizteca-analyze = "maizteca_analysis.cli:main"
