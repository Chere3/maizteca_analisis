[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maizteca-analisis"
version = "0.1.0"
description = "Market survey analysis toolkit"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
